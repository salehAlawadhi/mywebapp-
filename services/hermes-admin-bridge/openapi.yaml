openapi: 3.1.0
info:
  title: HELYRO Hermes Admin Bridge
  version: 0.1.0
servers:
  - url: http://hermes-admin-bridge:8787
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Check bridge and required dependencies
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Bridge, database, and Hermes are available
        "503":
          description: A required dependency is unavailable
  /v1/hermes/runs:
    post:
      summary: Dispatch a task handoff to Hermes
      operationId: createHermesRun
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispatchRun"
      responses:
        "202":
          description: Hermes run accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency conflict or request still in progress
        "422":
          description: Validation failed
  /v1/hermes/runs/{runId}:
    get:
      summary: Read the current Hermes run state
      operationId: getHermesRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Hermes run status
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Hermes request failed
  /v1/hermes/runs/{runId}/stop:
    post:
      summary: Request cancellation of a Hermes run
      operationId: stopHermesRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: Stop request accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Hermes request failed
  /v1/notifications:
    post:
      summary: Send a signed notification event to n8n
      operationId: createNotification
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationEvent"
      responses:
        "202":
          description: Notification accepted by n8n
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Idempotency conflict or request still in progress
        "422":
          description: Validation failed
        "502":
          description: n8n is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid bridge credentials
  schemas:
    DispatchRun:
      type: object
      additionalProperties: false
      required:
        - taskId
        - projectId
        - handoffVersion
        - title
        - instructions
        - handoff
      properties:
        taskId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        handoffVersion:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 200
        instructions:
          type: string
          maxLength: 12000
        handoff:
          type: string
          maxLength: 50000
        metadata:
          type: object
          additionalProperties:
            type: string
    NotificationEvent:
      type: object
      additionalProperties: false
      required:
        - eventId
        - eventType
        - occurredAt
        - message
        - channels
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - TASK_READY
            - APPROVAL_REQUIRED
            - TASK_COMPLETED
            - TASK_FAILED
        occurredAt:
          type: string
          format: date-time
        taskId:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        message:
          type: string
          maxLength: 4000
        channels:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
            enum: [telegram, whatsapp, email]
        data:
          type: object
